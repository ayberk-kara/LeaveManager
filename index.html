<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>LeaveManager</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      padding: 40px;
    }

    .container {
      max-width: 720px;
      margin: auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      position: relative;
    }

    .lang-switch {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 14px;
    }

    .lang-switch button {
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 6px;
      font-weight: 600;
    }

    h1 {
      margin-top: 0;
    }

    .buttons {
      margin: 24px 0;
    }

    .buttons a {
      display: inline-block;
      padding: 12px 18px;
      margin-right: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .primary {
      background: #111;
      color: #fff;
    }

    .secondary {
      border: 2px solid #111;
      color: #111;
    }

    ul {
      padding-left: 20px;
    }

    .note {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="lang-switch">
    <button onclick="setLang('tr')">🇹🇷 TR</button> |
    <button onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <h1 data-i18n="title"></h1>

  <p data-i18n="description"></p>

  <div class="buttons">
    <a class="primary" href="setup.exe" data-i18n="install"></a>
    <a class="secondary" href="LeaveManager.App.application" data-i18n="altInstall"></a>
  </div>

  <h3 data-i18n="during"></h3>
  <ul>
    <li data-i18n="warning"></li>
    <li data-i18n="autoOpen"></li>
  </ul>

  <p class="note" data-i18n="note"></p>
</div>

<script>
  const texts = {
    tr: {
      title: "LeaveManager",
      description: "Personel izinlerini takip etmek için kullanılan masaüstü uygulamasıdır.",
      install: "Kurulumu Başlat",
      altInstall: "Uygulamayı Kur (Alternatif)",
      during: "Kurulum sırasında",
      warning: "Windows bir güvenlik uyarısı gösterirse “Daha fazla bilgi” → “Yine de çalıştır” seçin.",
      autoOpen: "Kurulum tamamlandıktan sonra uygulama otomatik olarak açılır.",
      note: "Kurulum yalnızca bir kez yapılır. Daha sonra uygulamayı masaüstünden veya Başlat menüsünden açabilirsiniz."
    },
    en: {
      title: "LeaveManager",
      description: "A desktop application used to manage employee leave records.",
      install: "Start Installation",
      altInstall: "Install Application (Alternative)",
      during: "During installation",
      warning: "If Windows shows a security warning, select “More info” → “Run anyway”.",
      autoOpen: "The application will open automatically after installation.",
      note: "Installation is required only once. Afterwards, you can open the application from the desktop or Start menu."
    }
  };

  function setLang(lang) {
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      el.textContent = texts[lang][key];
    });
  }

  // default language
  const savedLang = localStorage.getItem("lang") || "tr";
  setLang(savedLang);
</script>

</body>
</html>
